<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마이 헬스 로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f8f6;
    --surface: #ffffff;
    --ink: #12312e;
    --ink-soft: #5a7d76;
    --brand: #0f6b5c;
    --brand-soft: #e4f2ee;
    --good: #2f8f6d;
    --good-bg: #e6f6ef;
    --warn: #b8790c;
    --warn-bg: #fdf1dd;
    --danger: #c14a3a;
    --danger-bg: #fbe8e4;
    --line: #dde8e5;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 28px 24px 20px;
    max-width: 1080px;
    margin: 0 auto;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--brand);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  .summary-bar {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .summary-chip {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .summary-chip strong {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 60px;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }

  .card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin: 0 0 16px;
  }

  form {
    display: grid;
    gap: 12px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  label {
    font-size: 12.5px;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 4px;
  }

  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    background: #fbfdfc;
    color: var(--ink);
  }

  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 1px;
  }

  textarea { resize: vertical; min-height: 44px; }

  button.submit {
    margin-top: 6px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.submit:hover { background: #0c5749; }
  button.submit:disabled { background: #a9c4bd; cursor: default; }

  .result-box {
    margin-top: 14px;
    border-radius: 10px;
    padding: 14px;
    border: 1px solid var(--line);
    background: var(--brand-soft);
    font-size: 13px;
    display: none;
  }

  .result-box.show { display: block; }

  .result-box .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .result-box .warn-msg {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    color: var(--danger);
    font-size: 12.5px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.danger { background: var(--danger-bg); color: var(--danger); }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  button.refresh {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button.refresh:hover { background: var(--brand-soft); }

  .records-scroll {
    max-height: 640px;
    overflow-y: auto;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 8px 8px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--surface);
  }

  tbody td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  .num { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }

  .del-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--danger);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .del-btn:hover { background: var(--danger-bg); }

  .empty-state, .loading-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Personal Health Tracker</div>
  <h1>마이 헬스 로그</h1>
  <p>오늘의 건강 수치를 기록하면, BMI·혈압·혈당·활동량을 자동으로 분석해드려요.</p>
  <div class="summary-bar" id="summaryBar">
    <div class="summary-chip">총 기록 <strong id="chipCount">-</strong></div>
    <div class="summary-chip">평균 체중 <strong id="chipWeight">-</strong> kg</div>
    <div class="summary-chip">평균 BMI <strong id="chipBmi">-</strong></div>
  </div>
</header>

<main>
  <section class="card">
    <h2>새 기록 입력</h2>
    <form id="recordForm">
      <div>
        <label for="date">측정일</label>
        <input type="date" id="date" required max="" />
      </div>
      <div class="field-row">
        <div>
          <label for="weight">몸무게 (kg)</label>
          <input type="number" step="0.1" id="weight" required />
        </div>
        <div>
          <label for="height">키 (cm)</label>
          <input type="number" step="0.1" id="height" required />
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="systolic">수축기 혈압</label>
          <input type="number" id="systolic" required />
        </div>
        <div>
          <label for="diastolic">이완기 혈압</label>
          <input type="number" id="diastolic" required />
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="blood_sugar">공복 혈당</label>
          <input type="number" id="blood_sugar" required />
        </div>
        <div>
          <label for="steps">걸음 수</label>
          <input type="number" id="steps" value="0" />
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="sleep_hours">수면 시간</label>
          <input type="number" step="0.1" id="sleep_hours" value="0" />
        </div>
        <div></div>
      </div>
      <div>
        <label for="memo">메모</label>
        <textarea id="memo" placeholder="간단한 메모 (선택)"></textarea>
      </div>
      <button type="submit" class="submit" id="submitBtn">기록 저장</button>
    </form>

    <div class="result-box" id="resultBox">
      <div><strong>방금 저장된 기록</strong></div>
      <div class="pills" id="resultPills"></div>
      <div class="warn-msg" id="resultWarnings" style="display:none;"></div>
    </div>
  </section>

  <section class="card">
    <div class="list-header">
      <h2 style="margin:0;">전체 기록</h2>
      <button class="refresh" id="refreshBtn">새로고침</button>
    </div>
    <div class="records-scroll">
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>체중</th>
            <th>BMI</th>
            <th>혈압</th>
            <th>혈당</th>
            <th>활동량</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
      <div class="loading-state" id="loadingState" style="display:none;">불러오는 중...</div>
      <div class="empty-state" id="emptyState" style="display:none;">아직 기록이 없어요. 왼쪽에서 첫 기록을 추가해보세요.</div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = ""; // 같은 서버에서 서비스되므로 상대 경로 사용

  const pillClass = {
    bmi_category:   { "저체중": "warn", "정상": "good", "과체중": "warn", "비만": "danger" },
    bp_category:    { "정상": "good", "주의": "warn", "고혈압": "danger" },
    sugar_category: { "정상": "good", "공복혈당장애": "warn", "당뇨 의심": "danger" },
    steps_category: { "부족": "warn", "적정": "good", "우수": "good" },
  };

  function pill(field, value) {
    const cls = (pillClass[field] && pillClass[field][value]) || "good";
    return `<span class="pill ${cls}">${value}</span>`;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  async function fetchRecords() {
    const body = document.getElementById("recordsBody");
    const loading = document.getElementById("loadingState");
    const empty = document.getElementById("emptyState");
    body.innerHTML = "";
    loading.style.display = "block";
    empty.style.display = "none";

    try {
      const res = await fetch(`${API}/records`);
      const data = await res.json();
      loading.style.display = "none";

      if (!data.records || data.records.length === 0) {
        empty.style.display = "block";
        return;
      }

      data.records
        .slice()
        .reverse()
        .forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.date}</td>
            <td class="num">${r.weight}kg</td>
            <td class="num">${r.bmi ?? "-"} ${r.bmi_category ? pill("bmi_category", r.bmi_category) : ""}</td>
            <td>${r.bp_category ? pill("bp_category", r.bp_category) : "-"}</td>
            <td>${r.sugar_category ? pill("sugar_category", r.sugar_category) : "-"}</td>
            <td>${r.steps_category ? pill("steps_category", r.steps_category) : "-"}</td>
            <td><button class="del-btn" data-id="${r.id}">삭제</button></td>
          `;
          body.appendChild(tr);
        });

      document.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", () => deleteRecord(btn.dataset.id));
      });

      fetchStats();
    } catch (err) {
      loading.style.display = "none";
      empty.style.display = "block";
      document.getElementById("emptyState").textContent = "기록을 불러오지 못했어요. 서버 연결을 확인해주세요.";
    }
  }

  async function fetchStats() {
    try {
      const res = await fetch(`${API}/stats`);
      const data = await res.json();
      document.getElementById("chipCount").textContent = data.count ?? 0;
      document.getElementById("chipWeight").textContent = data.average_weight ?? "-";
      document.getElementById("chipBmi").textContent = data.average_bmi ?? "-";
    } catch (err) {
      // 통계 조회 실패는 조용히 무시 (핵심 기능이 아니므로)
    }
  }

  async function deleteRecord(id) {
    try {
      await fetch(`${API}/records/${id}`, { method: "DELETE" });
      showToast(`${id}번 기록을 삭제했어요`);
      fetchRecords();
    } catch (err) {
      showToast("삭제에 실패했어요");
    }
  }

  document.getElementById("recordForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "저장 중...";

    const payload = {
      date: document.getElementById("date").value,
      weight: parseFloat(document.getElementById("weight").value),
      height: parseFloat(document.getElementById("height").value),
      systolic: parseInt(document.getElementById("systolic").value),
      diastolic: parseInt(document.getElementById("diastolic").value),
      blood_sugar: parseInt(document.getElementById("blood_sugar").value),
      steps: parseInt(document.getElementById("steps").value || 0),
      sleep_hours: parseFloat(document.getElementById("sleep_hours").value || 0),
      memo: document.getElementById("memo").value,
    };

    try {
      const res = await fetch(`${API}/records`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) throw new Error("저장 실패");
      const saved = await res.json();

      const resultBox = document.getElementById("resultBox");
      const pills = document.getElementById("resultPills");
      pills.innerHTML = [
        pill("bmi_category", saved.bmi_category),
        pill("bp_category", saved.bp_category),
        pill("sugar_category", saved.sugar_category),
        saved.steps_category ? pill("steps_category", saved.steps_category) : "",
      ].join(" ");

      const warnBox = document.getElementById("resultWarnings");
      if (saved.warnings && saved.warnings.length > 0) {
        warnBox.style.display = "block";
        warnBox.innerHTML = saved.warnings.map((w) => `⚠ ${w}`).join("<br/>");
      } else {
        warnBox.style.display = "none";
      }
      resultBox.classList.add("show");

      showToast("기록이 저장됐어요");
      document.getElementById("recordForm").reset();
      document.getElementById("steps").value = 0;
      document.getElementById("sleep_hours").value = 0;
      fetchRecords();
    } catch (err) {
      showToast("저장에 실패했어요. 입력값을 확인해주세요.");
    } finally {
      btn.disabled = false;
      btn.textContent = "기록 저장";
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", fetchRecords);

  // 페이지 열리면 날짜 기본값을 오늘로 설정하고,
  // 오늘보다 미래 날짜는 달력에서 아예 선택하지 못하도록 max 속성도 오늘 날짜로 제한
  const today = new Date();
  const todayStr = today.toISOString().split("T")[0]; // "YYYY-MM-DD" 형태로 변환
  const dateInput = document.getElementById("date");
  dateInput.max = todayStr;
  dateInput.valueAsDate = today;

  // 혹시라도(키보드 입력 등으로) 미래 날짜가 들어가면 저장 시 한 번 더 확인
  dateInput.addEventListener("change", () => {
    if (dateInput.value > todayStr) {
      showToast("미래 날짜는 기록할 수 없어요");
      dateInput.value = todayStr;
    }
  });

  // 숫자 입력창에 "최대 자릿수 제한"을 거는 함수
  // (type="number"는 maxlength가 적용되지 않아서, 입력할 때마다 직접 자릿수를 세어 잘라줌)
  function limitDigits(inputEl, maxDigits) {
    inputEl.addEventListener("input", () => {
      let value = inputEl.value;
      let digitCount = (value.match(/\d/g) || []).length; // 값 안에 있는 숫자(0~9) 개수만 세기

      // 자릿수가 제한을 넘으면, 뒤에서부터 한 글자씩 지워서 제한 이내로 맞춤
      while (digitCount > maxDigits && value.length > 0) {
        value = value.slice(0, -1);
        digitCount = (value.match(/\d/g) || []).length;
      }
      inputEl.value = value;
    });
  }

  // 몸무게 / 키 / 수축기 혈압 / 이완기 혈압 / 공복 혈당 → 최대 3자리
  limitDigits(document.getElementById("weight"), 3);
  limitDigits(document.getElementById("height"), 3);
  limitDigits(document.getElementById("systolic"), 3);
  limitDigits(document.getElementById("diastolic"), 3);
  limitDigits(document.getElementById("blood_sugar"), 3);

  // 수면 시간 → 최대 2자리
  limitDigits(document.getElementById("sleep_hours"), 2);

  fetchRecords();
</script>
</body>
</html>
